<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f4f6f8; color: #333; padding: 2rem; display: flex; justify-content: center; }
    .container { max-width: 900px; width: 100%; }
    h1 { margin-bottom: 1.5rem; text-align: center; color: #1a202c; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 1rem; }
    .card { 
      background: #fff; 
      padding: 1.2rem; 
      border-radius: 10px; 
      box-shadow: 0 2px 5px rgba(0,0,0,0.08); 
      text-align: center;
      text-decoration: none;
      color: #2b6cb0; 
      font-weight: bold; 
      font-size: 1.1rem;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 80px;
    }
    .card:hover { 
      transform: translateY(-3px); 
      box-shadow: 0 6px 12px rgba(0,0,0,0.15); 
      background: #ebf8ff;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📌 Quick Links</h1>
    <div class="grid">
      
      <!-- ADD YOUR LINKS HERE (Copy/Paste these lines for more buttons) -->
      <a href="https://www.google.com" target="_blank" class="card">Google</a>
      <a href="https://drive.google.com" target="_blank" class="card">Google Drive</a>
      <a href="https://mail.google.com" target="_blank" class="card">Gmail</a>
      <a href="https://github.com" target="_blank" class="card">GitHub</a>
      <a href="https://notion.so" target="_blank" class="card">Notion</a>

    </div>
  </div>
</body>
</html>
