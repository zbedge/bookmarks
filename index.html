<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRM Dashboard</title>
  <style>
    /* RESET & CORE VARIABLES */
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    
    :root {
      --bg-main: #0a0203;
      --card-bg: #140507;
      --card-border: #4a0e17;
      --red-accent: #dc2626;
      --red-glow: rgba(220, 38, 38, 0.4);
      --red-bright-glow: rgba(239, 68, 68, 0.7);
      --green-accent: #22c55e;
      --green-glow: rgba(34, 197, 94, 0.4);
      --text-color: #fecdd3;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
      background-image: radial-gradient(circle at 50% 20%, #2a080c 0%, #0a0203 70%);
      background-attachment: fixed;
    }

    /* TOP HEADER & HAMBURGER MENU */
    .header-bar {
      width: 100%;
      max-width: 900px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 2.5rem;
      padding: 0.5rem 0;
      border-bottom: 1px solid var(--card-border);
    }

    .menu-toggle {
      background: transparent;
      border: 1px solid var(--card-border);
      color: #ef4444;
      font-size: 1.5rem;
      padding: 0.4rem 0.8rem;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .menu-toggle:hover {
      background: #2a080c;
      box-shadow: 0 0 10px var(--red-glow);
    }

    .header-title {
      font-size: 2rem;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-shadow: 0 0 12px var(--red-bright-glow), 0 0 20px rgba(220, 38, 38, 0.3);
    }

    .header-placeholder { width: 45px; } /* Balances header centering */

    /* SIDEBAR SLIDE-OUT */
    .sidebar {
      position: fixed;
      top: 0;
      left: -280px;
      width: 280px;
      height: 100%;
      background: #0d0304;
      border-right: 1px solid var(--card-border);
      box-shadow: 5px 0 25px rgba(0, 0, 0, 0.8);
      transition: left 0.3s ease;
      z-index: 100;
      padding: 2rem 1.5rem;
    }

    .sidebar.open {
      left: 0;
    }

    .sidebar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 1rem;
    }

    .sidebar-title {
      color: #ef4444;
      font-size: 1.2rem;
      font-weight: 700;
    }

    .close-btn {
      background: none;
      border: none;
      color: #991b1b;
      font-size: 1.8rem;
      cursor: pointer;
    }

    .close-btn:hover { color: #ef4444; }

    .sidebar-menu { list-style: none; }
    .sidebar-menu li { margin-bottom: 1rem; }
    .sidebar-menu a {
      color: #fca5a5;
      text-decoration: none;
      font-size: 1rem;
      display: block;
      padding: 0.5rem 0.8rem;
      border-radius: 6px;
      transition: background 0.2s;
    }
    .sidebar-menu a:hover {
      background: #2a080c;
      color: #ffffff;
    }

    /* OVERLAY WHEN SIDEBAR IS OPEN */
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      display: none;
      z-index: 99;
    }
    .overlay.active { display: block; }

    /* CONTAINER & GRID */
    .container {
      max-width: 900px;
      width: 100%;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.25rem;
    }

    /* LINK BUTTON / CARD STYLES */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 1.25rem;
      text-decoration: none;
      color: #fca5a5;
      font-weight: 700;
      font-size: 1.05rem;
      display: flex;
      align-items: center;
      gap: 0.8rem;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
      position: relative;
      overflow: hidden;
    }

    /* DEFAULT RED GLOW HOVER */
    .card:hover {
      transform: translateY(-4px);
      border-color: var(--red-accent);
      color: #ffffff;
      box-shadow: 0 0 15px var(--red-glow), 0 0 30px rgba(220, 38, 38, 0.2);
      background: #1f070a;
    }

    /* SPECIAL GREEN ADMIN BUTTON GLOW */
    .card.green-admin {
      border-color: #14532d;
      color: #86efac;
    }
    .card.green-admin:hover {
      border-color: var(--green-accent);
      color: #ffffff;
      box-shadow: 0 0 15px var(--green-glow), 0 0 30px rgba(34, 197, 94, 0.2);
      background: #052e16;
    }

    .icon {
      font-size: 1.4rem;
    }
  </style>
</head>
<body>

  <!-- SIDEBAR & OVERLAY -->
  <div class="overlay" id="overlay" onclick="toggleMenu()"></div>
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-title">Menu & Extra Tools</span>
      <button class="close-btn" onclick="toggleMenu()">&times;</button>
    </div>
    <ul class="sidebar-menu">
      <li><a href="#">📌 Main Dashboard</a></li>
      <li><a href="https://admin.edgegaming.io/admin/qbet/homepage" target="_blank">🟢 Green Admin</a></li>
      <li><a href="https://admin.apexplatform.io/login" target="_blank">🔴 Red Admin</a></li>
      <li><a href="https://ibet.atlassian.net/jira/core/projects/CAM/calendar" target="_blank">📅 Jira Calendar</a></li>
    </ul>
  </div>

  <!-- MAIN CONTENT CONTAINER -->
  <div class="container">
    
    <!-- HEADER BAR WITH 3-BAR MENU -->
    <div class="header-bar">
      <button class="menu-toggle" onclick="toggleMenu()" title="Open Menu">☰</button>
      <h1 class="header-title">CRM</h1>
      <div class="header-placeholder"></div>
    </div>

    <!-- BUTTON GRID -->
    <div class="grid">
      
      <!-- 1. GREEN ADMIN -->
      <a href="https://admin.edgegaming.io/admin/qbet/homepage" target="_blank" class="card green-admin">
        <span class="icon">🟢</span>
        GREEN ADMIN
      </a>

      <!-- 2. RED ADMIN -->
      <a href="https://admin.apexplatform.io/login" target="_blank" class="card">
        <span class="icon">🔴</span>
        RED ADMIN
      </a>

      <!-- 3. GAME RELEASE -->
      <a href="https://docs.google.com/spreadsheets/d/1uoTSV1EpmYpohtTDhrEYyEZDEVvEMguNdyR4qMxXuIE/edit?gid=0#gid=0" target="_blank" class="card">
        <span class="icon">🎮</span>
        GAME RELEASE
      </a>

      <!-- 4. COUNTRY TESTING -->
      <a href="https://docs.google.com/spreadsheets/d/1P-UGjrhh5FRh2vuyyGQFTJuBGiXoL8Ec_KPwmhUmcqo/edit?gid=335110277#gid=335110277" target="_blank" class="card">
        <span class="icon">🌍</span>
        COUNTRY TESTING
      </a>

      <!-- 5. CRM CALENDAR -->
      <a href="https://docs.google.com/spreadsheets/d/13ubzW7K15O2tr_0ORf7Q1BwqJiCOWa1f9w8DL5WH1dc/edit?gid=305835903#gid=305835903" target="_blank" class="card">
        <span class="icon">📊</span>
        CRM CALENDAR
      </a>

      <!-- 6. JIRA -->
      <a href="https://ibet.atlassian.net/jira/core/projects/CAM/calendar" target="_blank" class="card">
        <span class="icon">📅</span>
        JIRA
      </a>

    </div>
  </div>

  <script>
    function toggleMenu() {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('overlay');
      sidebar.classList.toggle('open');
      overlay.classList.toggle('active');
    }
  </script>

</body>
</html>
