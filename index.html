<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRM Dashboard</title>
  <!-- Sleek Modern Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <style>
    /* RESET & CORE VARIABLES */
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
    
    :root {
      --bg-main: #0a0203;
      --card-bg: #120406;
      --card-border: #3b0a11;
      --red-accent: #dc2626;
      --red-glow: rgba(220, 38, 38, 0.35);
      --red-bright-glow: rgba(239, 68, 68, 0.5);
      --green-accent: #22c55e;
      --green-glow: rgba(34, 197, 94, 0.35);
      --text-color: #e2e8f0;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-bottom: 3rem;
      background-image: radial-gradient(circle at 50% 15%, #220609 0%, #0a0203 75%);
      background-attachment: fixed;
    }

    /* PROMINENT BANNER WITH BLACK GLOW & SWOOSH EFFECT */
    .banner-container {
      width: 100%;
      background: #050102;
      border-bottom: 1px solid #4a0d17;
      padding: 1.8rem 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.8);
    }

    /* SWOOSH LIGHT ANIMATION */
    .banner-container::before {
      content: "";
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        90deg, 
        transparent 0%, 
        rgba(220, 38, 38, 0.12) 30%, 
        rgba(0, 0, 0, 0.8) 50%, 
        rgba(220, 38, 38, 0.18) 70%, 
        transparent 100%
      );
      animation: swoosh 7s infinite ease-in-out;
      pointer-events: none;
    }

    @keyframes swoosh {
      0% { left: -100%; }
      50% { left: 100%; }
      100% { left: 100%; }
    }

    .banner-content {
      position: relative;
      z-index: 2;
      text-align: center;
    }

    .banner-title {
      font-size: 2.2rem;
      font-weight: 300;
      color: #ffffff;
      letter-spacing: 6px;
      text-transform: uppercase;
      text-shadow: 0 0 15px rgba(220, 38, 38, 0.4), 0 0 30px rgba(0, 0, 0, 0.9);
    }

    .banner-subtitle {
      font-size: 0.75rem;
      font-weight: 400;
      letter-spacing: 2px;
      color: #991b1b;
      text-transform: uppercase;
      margin-top: 0.3rem;
    }

    /* TOP HEADER BAR FOR MENU BUTTON */
    .header-bar {
      width: 100%;
      max-width: 900px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      margin: 1.5rem 0 1.5rem 0;
      padding: 0 1rem;
    }

    .menu-toggle {
      background: transparent;
      border: 1px solid #7f1d1d;
      color: #ef4444;
      font-size: 1.1rem;
      padding: 0.4rem 0.7rem;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .menu-toggle:hover {
      background: #2a080c;
      border-color: #dc2626;
      box-shadow: 0 0 8px var(--red-glow);
    }

    /* SIDEBAR SLIDE-OUT */
    .sidebar {
      position: fixed;
      top: 0;
      left: -300px;
      width: 300px;
      height: 100%;
      background: #0d0304;
      border-right: 1px solid var(--card-border);
      box-shadow: 5px 0 25px rgba(0, 0, 0, 0.85);
      transition: left 0.3s ease;
      z-index: 100;
      padding: 2rem 1.2rem;
      overflow-y: auto;
    }

    .sidebar.open { left: 0; }

    .sidebar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 1rem;
    }

    .sidebar-title {
      color: #ef4444;
      font-size: 1rem;
      font-weight: 500;
      letter-spacing: 1px;
    }

    .close-btn {
      background: none;
      border: none;
      color: #991b1b;
      font-size: 1.5rem;
      cursor: pointer;
    }

    .close-btn:hover { color: #ef4444; }

    .sidebar-menu { list-style: none; }
    .sidebar-menu li { margin-bottom: 0.6rem; }
    
    .sidebar-menu a, .dropdown-btn {
      color: #fca5a5;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 300;
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 0.64rem 0.8rem;
      border-radius: 4px;
      transition: background 0.2s;
      background: transparent;
      border: none;
      cursor: pointer;
      text-align: left;
    }

    .sidebar-menu a:hover, .dropdown-btn:hover {
      background: #2a080c;
      color: #ffffff;
    }

    /* DROPDOWN MENU ACCORDION */
    .dropdown-container {
      display: none;
      background-color: #060102;
      padding-left: 0.8rem;
      margin-top: 0.3rem;
      border-left: 1px solid #3b0a11;
      border-radius: 0 0 4px 4px;
    }

    .dropdown-container a {
      font-size: 0.85rem;
      color: #cbd5e1;
      padding: 0.5rem 0.8rem;
    }

    .dropdown-container a:hover {
      color: #ef4444;
      background: #180305;
    }

    .arrow {
      font-size: 0.7rem;
      transition: transform 0.2s ease;
    }

    .dropdown-btn.active .arrow {
      transform: rotate(180deg);
    }

    /* OVERLAY WHEN SIDEBAR IS OPEN */
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.75);
      display: none;
      z-index: 99;
    }
    .overlay.active { display: block; }

    /* CONTAINER & GRID */
    .container {
      max-width: 900px;
      width: 100%;
      padding: 0 1rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 1.2rem;
    }

    /* LINK BUTTON STYLES */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 6px;
      padding: 1.2rem;
      text-decoration: none;
      color: #cbd5e1;
      font-weight: 400;
      font-size: 0.95rem;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      transition: all 0.25s ease;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
      min-height: 75px;
    }

    /* DEFAULT RED GLOW HOVER */
    .card:hover {
      transform: translateY(-3px);
      border-color: var(--red-accent);
      color: #ffffff;
      box-shadow: 0 0 12px var(--red-glow), 0 0 25px rgba(220, 38, 38, 0.15);
      background: #1a0507;
    }

    /* GREEN ADMIN BUTTON GLOW */
    .card.green-admin {
      border-color: #14532d;
      color: #86efac;
    }
    .card.green-admin:hover {
      border-color: var(--green-accent);
      color: #ffffff;
      box-shadow: 0 0 12px var(--green-glow), 0 0 25px rgba(34, 197, 94, 0.15);
      background: #042110;
    }
  </style>
</head>
<body>

  <!-- PROMINENT BANNER -->
  <div class="banner-container">
    <div class="banner-content">
      <h1 class="banner-title">CRM</h1>
      <div class="banner-subtitle">Central Workspace</div>
    </div>
  </div>

  <!-- SIDEBAR & OVERLAY -->
  <div class="overlay" id="overlay" onclick="toggleMenu()"></div>
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-title">Menu & Resources</span>
      <button class="close-btn" onclick="toggleMenu()">&times;</button>
    </div>
    <ul class="sidebar-menu">
      <li><a href="#">Main Dashboard</a></li>
      
      <!-- 55BET CONTENT DROPDOWN -->
      <li>
        <button class="dropdown-btn" onclick="toggleDropdown(this)">
          55Bet Content
          <span class="arrow">▼</span>
        </button>
        <div class="dropdown-container">
          <a href="https://docs.google.com/spreadsheets/d/1XK5zsltb_1meqUC1utJcM5KZmz4egPOqPgOZgxvULe0/edit?gid=10001#gid=10001" target="_blank">Reactivation Content</a>
          <a href="https://docs.google.com/spreadsheets/d/18KG8Fm0v1wibKfogBq-2ZWwMsOaNQUiQm-J69BDNvy8/edit?gid=937661406#gid=937661406" target="_blank">Game of the Week</a>
          <a href="https://docs.google.com/spreadsheets/d/1-mC3_omjUD2JeYjaFKIM8JPxe82aQyNqlH6NlIeQAxA/edit?gid=10001#gid=10001" target="_blank">Payday</a>
        </div>
      </li>

      <li><a href="https://admin.edgegaming.io/admin/qbet/homepage" target="_blank">Green Admin</a></li>
      <li><a href="https://admin.apexplatform.io/login" target="_blank">Red Admin</a></li>
      <li><a href="https://ibet.atlassian.net/jira/core/projects/CAM/calendar" target="_blank">Jira Calendar</a></li>
    </ul>
  </div>

  <!-- MAIN CONTENT CONTAINER -->
  <div class="container">
    
    <!-- HEADER BAR WITH 3-BAR MENU BUTTON -->
    <div class="header-bar">
      <button class="menu-toggle" onclick="toggleMenu()" title="Open Menu">☰</button>
    </div>

    <!-- BUTTON GRID -->
    <div class="grid">
      
      <!-- 1. GREEN ADMIN -->
      <a href="https://admin.edgegaming.io/admin/qbet/homepage" target="_blank" class="card green-admin">
        GREEN ADMIN
      </a>

      <!-- 2. RED ADMIN -->
      <a href="https://admin.apexplatform.io/login" target="_blank" class="card">
        RED ADMIN
      </a>

      <!-- 3. GAME RELEASE -->
      <a href="https://docs.google.com/spreadsheets/d/1uoTSV1EpmYpohtTDhrEYyEZDEVvEMguNdyR4qMxXuIE/edit?gid=0#gid=0" target="_blank" class="card">
        GAME RELEASE
      </a>

      <!-- 4. COUNTRY TESTING -->
      <a href="https://docs.google.com/spreadsheets/d/1P-UGjrhh5FRh2vuyyGQFTJuBGiXoL8Ec_KPwmhUmcqo/edit?gid=335110277#gid=335110277" target="_blank" class="card">
        COUNTRY TESTING
      </a>

      <!-- 5. CRM CALENDAR -->
      <a href="https://docs.google.com/spreadsheets/d/13ubzW7K15O2tr_0ORf7Q1BwqJiCOWa1f9w8DL5WH1dc/edit?gid=305835903#gid=305835903" target="_blank" class="card">
        CRM CALENDAR
      </a>

      <!-- 6. JIRA -->
      <a href="https://ibet.atlassian.net/jira/core/projects/CAM/calendar" target="_blank" class="card">
        JIRA
      </a>

    </div>
  </div>

  <script>
    function toggleMenu() {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('overlay');
      sidebar.classList.toggle('open');
      overlay.classList.toggle('active');
    }

    function toggleDropdown(btn) {
      btn.classList.toggle('active');
      const container = btn.nextElementSibling;
      if (container.style.display === "block") {
        container.style.display = "none";
      } else {
        container.style.display = "block";
      }
    }
  </script>

</body>
</html>
